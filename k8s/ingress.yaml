apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /v1/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 4000
          - path: /v1/projects
            pathType: Prefix
            backend:
              service:
                name: project-service
                port:
                  number: 4000
          - path: /v1/entities
            pathType: Prefix
            backend:
              service:
                name: entities-service
                port:
                  number: 4000
