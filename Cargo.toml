[workspace]
resolver = "3"
members = ["auth", "db_migrator", "projects", "entities"]

[workspace.dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.4", features = ["http2", "macros", "multipart", "tokio"] }
axum-extra = { version = "0.10.2", features = ["cookie", "json-deserializer"] }
axum-server = "0.7.2"
axum-test = "18.1.0"
dotenvy = "0.15.7"
jsonwebtoken = "9.3.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = ["uuid", "mysql", "time", "runtime-tokio"] }
thiserror = "2.0.17"
time = { version = "=0.3", features = ["serde"] }
tokio = { version = "1.48.0", features = ["rt", "rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.6.6", features = ["cors", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["json", "env-filter"] }
trait-variant = "0.1.2"
utoipa = { version = "5.4.0", features = ["chrono", "uuid"] }
utoipa-rapidoc = { version = "6.0.0", features = ["axum"] }
uuid = { version = "1.18.1", features = ["v4"] }
validator = { version = "0.20.0", features = ["derive"] }
opentelemetry = "0.31.0"
opentelemetry_sdk = { version = "0.31.0", features = ["experimental_metrics_custom_reader", "metrics"] }
opentelemetry-otlp = { version = "0.31.0", features = ["http-json"] }
tracing-opentelemetry = "0.32.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
