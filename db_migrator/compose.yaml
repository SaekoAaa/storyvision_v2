services:
  db_migrator:
    build:
      context: .
      target: final
    container_name: migrator

    depends_on:
      mysql:
        condition: service_healthy
    environment:
      CONFIG_PATH: "/app/config.yaml"
      DB_USER_FILE: /run/secrets/db_user
      DB_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - ./config/docker_config.yaml:/app/config.yaml
      - ./.env:/app/.env

  mysql:
    container_name: mysql
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "storyvision"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    expose:
      - 3306
    ports:
      - 3306
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -p$(cat /run/secrets/db_password) --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3s

    # volumes:
    #   - db_data:/var/lib/mysql
# volumes:
#   db_data:
