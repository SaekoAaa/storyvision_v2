services:
  neo4j:
    image: neo4j:5.15-community
    container_name: neo4j_graph
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474" # HTTP
      - "${NEO4J_BOLT_PORT:-7687}:7687" # Bolt
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_server_memory_heap_initial__size=512m
      # - NEO4J_server_memory_heap_max__size=2G
      # - NEO4J_server_memory_pagecache_size=512m
    expose:
      - "7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    networks:
      - graph_network
  entity_server:
    container_name: entity_server
    image: entities-service:1.0.4-a1c8cd7
    environment:
      APP_ADDRESS: "0.0.0.0"
      APP_PORT: 4000
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_URI: bolt://neo4j_graph:7687
      NEO4J_USER: ${NEO4J_USER}
      TEST_USER_DATA: true
      SALT: "12345salt"
    ports:
      - "4000:4000"
    depends_on:
      - neo4j
    expose:
      - "4000"
    networks:
      - graph_network
networks:
  graph_network:
    driver: bridge
volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
