services:
  neo4j:
    image: neo4j:5.15-community
    container_name: neo4j_graph
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_server_memory_heap_initial__size=512m
    expose:
      - "7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins

  entity_server:
    container_name: entity_server
    image: entities-service:1.1.1-a1c8cd7
    environment:
      APP_ADDRESS: "0.0.0.0"
      APP_PORT: 4000
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_URI: bolt://neo4j_graph:7687
      NEO4J_USER: ${NEO4J_USER}
      SALT: "12345salt"
    depends_on:
      - neo4j
    expose:
      - "4000"

  mysql:
    container_name: storyvision_db
    image: mysql:latest
    restart: always
    ports:
      - "3306:3306"
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 3s
      timeout: 3s
      retries: 3

  auth_server:
    build:
      context: .
      target: final
    image: auth-service:2.0.3-a1c8cd7
    container_name: auth_server
    environment:
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_PORT: 3306
      MYSQL_ADDRESS: "mysql"
      APP_ADDRESS: "0.0.0.0"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      DB_ADDRESS: "mysql"
      SALT: "12345salt"
    depends_on:
      - mysql
    expose:
      - "4000"

  projects_server:
    container_name: projects_server
    image: projects-service:2.0.2-b914a43
    environment:
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_PORT: 3306
      MYSQL_ADDRESS: "mysql"
      APP_ADDRESS: "0.0.0.0"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      DB_ADDRESS: "mysql"
      SALT: "12345salt"
    depends_on:
      - mysql
    expose:
      - "4000"

  nginx:
    image: nginx:latest
    container_name: gateway
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth_server
      - projects_server

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
