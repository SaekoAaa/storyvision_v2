nameOverride: mysql-service

image:
  repository: mysql
  tag: 9.6.0
  pullPolicy: IfNotPresent

auth:
  rootPassword: ""
  database: ""
  username: ""
  password: ""

service:
  port: 3306

persistence:
  size: 5Gi
  accessModes:
    - ReadWriteOnce
  storageClass: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
