apiVersion: v1
kind: Service
metadata:
  name: {{ include "storyvision-mysql.name" . }}
  labels:
    {{- include "storyvision-mysql.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "storyvision-mysql.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: mysql
      port: {{ .Values.service.port }}
      targetPort: mysql
