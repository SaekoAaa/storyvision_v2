controller:
  replicaCount: 1

  ingressClass:
    name: nginx
    create: true
    setAsDefaultIngress: false

  # Storyvision currently uses standard Ingress resources only.
  enableCustomResources: false
  enableSnippets: false

  service:
    type: NodePort
    externalTrafficPolicy: Cluster

  reportIngressStatus:
    enable: false

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
