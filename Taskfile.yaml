version: "3"
tasks:
  docker_build_migrator:
    aliases:
      - db_migrator
    cmds:
      - docker build -f db_migrator/Dockerfile -t db_migrator .
    desc: Build the Docker image for the database migrator service.
  run_auth:
    aliases:
      - au
    cmds:
      - cargo r --bin auth_service
    desc: Run the auth service.
