version: "3"
tasks:
  run_auth:
    aliases:
      - au
    cmds:
      - cargo r --bin auth_service
    desc: Run the auth service.
  apply_migration:
    aliases:
      - am
    cmds:
      - MIGRATION_TYPE=1 docker compose --profile migration up
    desc: Apply database migrations via Docker Compose

  revert_migration:
    aliases:
      - rm
    cmds:
      - MIGRATION_TYPE=2 docker compose --profile migration up
    desc: Revert database migrations via Docker Compose

  start_core:
    aliases:
      - core
    cmds:
      - docker compose --profile core up -d
    desc: Start Docker Compose with core components (MySQL, Auth, Projects)

  start_migration:
    aliases:
      - migrate
    vars:
      MIGRATION_TYPE: '{{default "1" .CLI_ARGS}}'
    cmds:
      - MIGRATION_TYPE={{.MIGRATION_TYPE}} docker compose --profile migration up
    desc: Run database migrations via Docker Compose. Pass type as arg (e.g. task migrate -- 3)

  start_nginx:
    aliases:
      - nginx
    cmds:
      - docker compose --profile gateway up -d
    desc: Start Nginx gateway

  start_observability:
    aliases:
      - monitoring
    cmds:
      - docker compose --profile monitoring up -d
    desc: Start observability tools (OTel, Jaeger, Prometheus)

  k8s_apply_secrets:
    desc: Create or update K8s secrets from local env file
    cmds:
      - kubectl create secret generic mysql-secret \
        --from-env-file=.secrets/mysql.env \
        --dry-run=client \
        -o yaml |
        kubectl apply -f -
      - kubectl describe secret mysql-secret
    vars:
      NAMESPACE: '{{default "default" .NAMESPACE}}'
      MYSQL_ENV: '{{default "k8s/.secrets/mysql.env/" .MYSQL_ENV}}'
    preconditions:
      - sh: command -v kubectl >/dev/null
        msg: kubectl is not installed
      - sh: test -f "{{.MYSQL_ENV}}"
        msg: "{{.MYSQL_ENV}} is missing; copy it
        from .secrets/mysql.env.example"
      - sh: kubectl cluster-info >/dev/null
        msg: kubectl cannot connect to the current
        cluster
    cmds:
      - |
        kubectl create secret generic mysql-secret \
          --namespace "{{.NAMESPACE}}" \
          --from-env-file="{{.MYSQL_ENV}}" \
          --dry-run=client \
          --output=yaml |
        kubectl apply --filename=-
